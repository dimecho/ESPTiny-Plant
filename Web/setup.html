<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tiny plant</title>
<script>
var savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
var savedFont = localStorage.getItem('fontSize') || 'medium';
document.documentElement.setAttribute('data-font', savedFont);

function applySvgTheme() {
  try {
    var win = document.getElementById('svgObject').contentDocument.defaultView;
    if (win && win.svgApplyTheme) {
      win.svgApplyTheme(document.documentElement.getAttribute('data-theme') === 'dark');
    }
  } catch(e) {}
}
</script>
  <link href="svg/bonsai.css" rel="stylesheet" type="text/css" />
  <style>
    .setup-bg {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 0;
      opacity: 0.4;
      pointer-events: none;
    }
    .setup-bg object {
      height: 100vh;
      max-width: 100vw;
      aspect-ratio: 1950 / 2018;
    }
    .setup-step {
      display: none;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .setup-step.active {
      display: flex;
      animation: fade-in 0.5s ease-out;
    }
    #step-power.active .setup-menu {
      animation: grow 0.8s ease-out;
      transform-origin: center center;
    }
    .setup-menu {
      display: flex;
      gap: 2rem;
      align-items: center;
      justify-content: center;
    }
    .setup-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 220px;
      height: 220px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease-in-out;
      user-select: none;
    }
    .setup-tile:hover {
      background: var(--card-hover-bg);
      border-color: var(--card-hover-border);
      transform: translateY(-4px);
    }
    .setup-tile.active {
      transform: scale(0.96);
    }
    .setup-tile svg {
      width: 64px;
      height: 64px;
      color: var(--card-title);
    }
    .setup-tile h3 {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--card-title);
    }
    .setup-form h3 {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--card-title);
      text-align: center;
      margin: 0;
    }
    .setup-waiting {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .setup-waiting h3 {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--card-title);
      text-align: center;
      margin: 0;
    }
    .setup-reconnect {
      font-size: 0.95rem;
      color: var(--card-title);
      text-align: center;
      margin: 0;
    }
    .setup-progress {
      width: 100%;
      height: 8px;
      background: var(--card-border);
      border-radius: 4px;
      overflow: hidden;
    }
    .setup-progress-bar {
      height: 100%;
      width: 0;
      background: #62a29a;
      animation: setup-progress-fill 6s linear forwards;
    }
    @keyframes setup-progress-fill {
      from { width: 0; }
      to { width: 100%; }
    }
    .setup-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 320px;
      max-width: 90vw;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 2rem;
    }
    .setup-scan {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      width: 320px;
      max-width: 90vw;
    }
    .setup-scan #scanList {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .setup-scan-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease-in-out;
      font-size: 1rem;
      color: var(--card-title);
      letter-spacing: 1px;
      text-align: left;
    }
    .setup-scan-item:hover {
      background: var(--card-hover-bg);
      border-color: var(--card-hover-border);
    }
    .setup-scan-item.active {
      transform: scale(0.96);
    }
    .setup-scan-item.selected {
      background: var(--card-hover-bg);
      border-color: #62a29a;
      box-shadow: 0 0 0 1px #62a29a;
    }
    .setup-scan-expand {
      display: flex;
      gap: 0.5rem;
      animation: fade-in 0.25s ease;
    }
    .setup-scan-expand .tab-input {
      flex: 1;
    }
    .setup-scan-warning {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem;
      background: rgba(255, 170, 50, 0.14);
      border: 1px solid rgba(255, 180, 70, 0.35);
      border-radius: 12px;
      text-align: center;
      color: #ffcf8f;
      font-size: 0.95rem;
    }
    [data-theme="light"] .setup-scan-warning {
      background: #fff3e0;
      border-color: #ffcc80;
      color: #9c6500;
    }
    header {
      position: relative;
      z-index: 1;
    }
    @media (max-width: 768px) {
      .setup-menu { flex-direction: column; }
      .setup-tile { width: 180px; height: 180px; }
    }
  </style>
</head>
<body>
<div id="preloader-overlay"><div id="preloader-bar"><div id="preloader-fill"></div></div></div>
<div class="setup-bg">
  <object data="svg/bonsai.svg" type="image/svg+xml" id="svgObject"></object>
</div>
<header>
  <button class="theme-toggle" id="themeToggle"></button>
  <button class="font-toggle" id="fontToggle">A</button>
</header>

<div class="setup-step active" id="step-power">
  <div class="setup-menu">
    <div class="setup-tile" id="tileBattery" role="button" tabindex="0" aria-label="Battery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="17" height="10" rx="2"/>
        <path d="M22 11v2"/>
        <path d="M6 11h9"/>
      </svg>
      <h3>Battery</h3>
    </div>
    <div class="setup-tile" id="tileOutlet" role="button" tabindex="0" aria-label="Plug">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22v-5"/>
        <path d="M9 8V2"/>
        <path d="M15 8V2"/>
        <path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>
      </svg>
      <h3>Plug</h3>
    </div>
  </div>
</div>

<div class="setup-step" id="step-connect">
  <div class="setup-menu">
    <div class="setup-tile" id="tileInternet" role="button" tabindex="0" aria-label="Internet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <h3>Internet</h3>
    </div>
    <div class="setup-tile" id="tileLocal" role="button" tabindex="0" aria-label="Local">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 13a10 10 0 0 1 14 0"/>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
        <path d="M12 20h.01"/>
      </svg>
      <h3>Local</h3>
    </div>
  </div>
</div>

<div class="setup-step" id="step-wifi">
  <form class="setup-form" id="wifiSetupForm">
    <label class="tab-label" for="setupSSID">SSID</label>
    <input type="text" class="tab-input" id="setupSSID" name="SSID" placeholder="Plant">
    <div class="alert-warn hidden" id="wifiSsidRequired">SSID cannot be blank</div>
    <label class="tab-checkbox-label"><input type="checkbox" class="tab-checkbox" id="setupHiddenSSID"> Hidden SSID</label>
    <label class="tab-label" for="setupPassword">Password</label>
    <input type="password" class="tab-input" id="setupPassword" name="Password" placeholder="Password">
    <label class="tab-label" for="setupConfirmPassword">Confirm Password</label>
    <input type="password" class="tab-input" id="setupConfirmPassword" placeholder="Password">
    <div class="alert-warn hidden" id="wifiPassMismatch">Passwords do not match</div>
    <button type="submit" class="tab-btn">Done</button>
  </form>
</div>

<div class="setup-step" id="step-plant-password">
  <form class="setup-form" id="plantPasswordForm">
    <h3>Plant Security (Optional)</h3>
    <label class="tab-label" for="setupPlantPassword">Web Access Password</label>
    <input type="password" class="tab-input" id="setupPlantPassword" placeholder="Password">
    <label class="tab-label" for="setupConfirmPlantPassword">Confirm Password</label>
    <input type="password" class="tab-input" id="setupConfirmPlantPassword" placeholder="Confirm Password">
    <div class="alert-warn hidden" id="plantPassMismatch">Passwords do not match</div>
    <button type="submit" class="tab-btn">Done</button>
  </form>
  <div class="setup-waiting hidden" id="setupWaiting">
    <h3>Finalizing Setup</h3>
    <p class="setup-reconnect hidden" id="reconnectMsg"></p>
    <div class="setup-progress"><div class="setup-progress-bar" id="progressBar"></div></div>
  </div>
</div>

<div class="setup-step" id="step-scan">
  <div class="setup-scan">
    <div id="scanWarning" class="setup-scan-warning hidden">
      <p>No wireless networks were detected. Verify the device is within range of a router or access point, then try again.</p>
      <button type="button" class="tab-btn" id="scanRefresh">Refresh</button>
    </div>
    <div id="scanList"></div>
  </div>
</div>

<div class="setup-step" id="step-alerts">
  <div class="setup-form">
    <label class="tab-label" for="setupAlertEmail">Recipient Email</label>
    <input type="text" class="tab-input" id="setupAlertEmail" placeholder="recipient@example.com">
    <label class="tab-label" for="setupAlertSMTPServer">SMTP Server</label>
    <input type="text" class="tab-input" id="setupAlertSMTPServer" placeholder="smtp.example.com">
    <label class="tab-label" for="setupAlertSMTPUsername">SMTP Username</label>
    <input type="text" class="tab-input" id="setupAlertSMTPUsername" placeholder="user@example.com">
    <label class="tab-label" for="setupAlertSMTPPassword">SMTP Password</label>
    <input type="password" class="tab-input" id="setupAlertSMTPPassword" placeholder="Password">
    <label class="tab-label" for="setupConfirmSMTPPassword">Confirm SMTP Password</label>
    <input type="password" class="tab-input" id="setupConfirmSMTPPassword" placeholder="Password">
    <div class="alert-warn hidden" id="smtpPassMismatch">Passwords do not match</div>
    <label class="tab-label" for="setupAlertPlantName">Plant Name</label>
    <input type="text" class="tab-input" id="setupAlertPlantName" placeholder="My Plant">
    <label class="tab-label">Send Email Alerts:</label>
    <input type="hidden" id="setupAlerts" value="">
    <div class="alert-checkbox-grid" id="setupAlertsGrid">
      <label class="tab-checkbox-label"><input type="checkbox" class="tab-checkbox"> DHCP IP</label>
      <label class="tab-checkbox-label"><input type="checkbox" class="tab-checkbox"> Low Battery</label>
      <label class="tab-checkbox-label"><input type="checkbox" class="tab-checkbox"> Low Moisture</label>
      <label class="tab-checkbox-label"><input type="checkbox" class="tab-checkbox"> Pump Run</label>
      <label class="tab-checkbox-label"><input type="checkbox" class="tab-checkbox"> Over Water</label>
      <label class="tab-checkbox-label"><input type="checkbox" class="tab-checkbox"> Empty Water</label>
      <label class="tab-checkbox-label"><input type="checkbox" class="tab-checkbox"> Internal Errors</label>
      <label class="tab-checkbox-label"><input type="checkbox" class="tab-checkbox"> High Priority</label>
    </div>
    <button type="button" class="tab-btn" id="alertsSaveBtn">Done</button>
  </div>
</div>

<script>
var preloader = document.getElementById('preloader-overlay');
window.addEventListener('load', function() {
  setTimeout(function() { preloader.classList.add('done'); }, 500);
});

var html = document.documentElement;
var themeToggle = document.getElementById('themeToggle');
themeToggle.textContent = savedTheme === 'dark' ? '\u2600' : '\u263E';
themeToggle.addEventListener('click', function() {
  var current = html.getAttribute('data-theme');
  var next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  this.textContent = next === 'dark' ? '\u2600' : '\u263E';
  applySvgTheme();
});

var svgObject = document.getElementById('svgObject');
svgObject.addEventListener('load', function() {
  try {
    var doc = svgObject.contentDocument;
    var menu = doc.getElementById('menu');
    if (!menu) {
      var all = doc.querySelectorAll('*');
      for (var i = 0; i < all.length; i++) {
        if (all[i].getAttribute('inkscape:label') === 'menu') {
          menu = all[i]; break;
        }
      }
    }
    if (menu) menu.style.display = 'none';
  } catch(e) {}
});

var fontSizes = ['small', 'medium', 'large'];
var fontToggle = document.getElementById('fontToggle');
fontToggle.textContent = savedFont === 'small' ? 'A' : savedFont === 'large' ? 'A\u207A' : 'A';
fontToggle.addEventListener('click', function() {
  var current = html.getAttribute('data-font') || 'medium';
  var idx = fontSizes.indexOf(current);
  var next = fontSizes[(idx + 1) % fontSizes.length];
  html.setAttribute('data-font', next);
  localStorage.setItem('fontSize', next);
  this.textContent = next === 'small' ? 'A' : next === 'large' ? 'A\u207A' : 'A';
});

var DEEP_SLEEP = 21;
var WIFI_MODE = 1;
var WIFI_SSID = 6;
var WIFI_PASSWORD = 8;
var WIFI_HIDE = 2;

function nvramGet(offset, value) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'nvram.json?offset=' + offset + '&value=' + encodeURIComponent(value), true);
  xhr.send();
}

function showStep(id) {
  var steps = document.querySelectorAll('.setup-step');
  for (var i = 0; i < steps.length; i++) {
    steps[i].classList.remove('active');
  }
  document.getElementById(id).classList.add('active');
}

function bindTile(tile, offset, value, next, onShow) {
  tile.addEventListener('click', function() {
    nvramGet(offset, value);
    showStep(next);
    if (onShow) onShow();
  });
  tile.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      this.click();
    }
  });
}

function parseScanResponse(text, status) {
  if (status !== 200 || !text) return null;
  var t = text.trim();
  if (!t || t.charAt(0) === '{' || t.charAt(0) === '[') return null;
  var aps = [];
  var lines = t.split('\n');
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    if (line.length > 32) return null;
    if (/[<>]/.test(line)) return null;
    if (/(\b(error|failed?|invalid|exception)\b|not found)/i.test(line)) return null;
    aps.push(line);
  }
  return aps.length ? aps : null;
}

var selectedScanItem = null;
var setupNetwork = null;
var setupSsid = null;
var setupWifiPass = null;

function renderScan(aps) {
  selectedScanItem = null;
  var list = document.getElementById('scanList');
  list.innerHTML = '';
  aps.forEach(function(ssid) {
    var item = document.createElement('button');
    item.type = 'button';
    item.className = 'setup-scan-item';
    item.setAttribute('data-ssid', ssid);
    item.textContent = ssid;
    item.addEventListener('mousedown', function() { this.classList.add('active'); });
    item.addEventListener('mouseup', function() { this.classList.remove('active'); });
    item.addEventListener('mouseleave', function() { this.classList.remove('active'); });
    item.addEventListener('click', function() { openScanPassword(this); });
    list.appendChild(item);
  });
}

function openScanPassword(item) {
  var next = item.nextSibling;
  if (next && next.className === 'setup-scan-expand') {
    item.parentNode.removeChild(next);
    item.classList.remove('selected');
    if (selectedScanItem === item) selectedScanItem = null;
    return;
  }
  if (selectedScanItem) selectedScanItem.classList.remove('selected');
  var list = item.parentNode;
  var existing = list.querySelector('.setup-scan-expand');
  if (existing) list.removeChild(existing);
  var exp = document.createElement('div');
  exp.className = 'setup-scan-expand';
  var input = document.createElement('input');
  input.type = 'password';
  input.className = 'tab-input';
  input.placeholder = 'Password';
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tab-btn';
  btn.textContent = 'Connect';
  btn.addEventListener('click', function() {
    nvramGet(WIFI_SSID, item.getAttribute('data-ssid'));
    if (input.value) nvramGet(WIFI_PASSWORD, input.value);
    showStep('step-alerts');
  });
  exp.appendChild(input);
  exp.appendChild(btn);
  list.insertBefore(exp, item.nextSibling);
  item.classList.add('selected');
  selectedScanItem = item;
  input.focus();
}

function scanWifi() {
  var warn = document.getElementById('scanWarning');
  warn.classList.add('hidden');
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'api?wifi=scan', true);
  xhr.send();
  xhr.onload = function() {
    var aps = parseScanResponse(xhr.responseText, xhr.status);
    if (aps) {
      renderScan(aps);
    } else {
      showScanWarning();
    }
  };
  xhr.onerror = function() {
    showScanWarning();
  };
}

function showScanWarning() {
  renderScan([]);
  document.getElementById('scanWarning').classList.remove('hidden');
}

document.querySelectorAll('.setup-tile').forEach(function(tile) {
  tile.addEventListener('mousedown', function() { this.classList.add('active'); });
  tile.addEventListener('mouseup', function() { this.classList.remove('active'); });
  tile.addEventListener('mouseleave', function() { this.classList.remove('active'); });
});

bindTile(document.getElementById('tileBattery'), DEEP_SLEEP, 10, 'step-connect');
bindTile(document.getElementById('tileOutlet'), DEEP_SLEEP, 0, 'step-connect');
bindTile(document.getElementById('tileInternet'), WIFI_MODE, 1, 'step-scan', function() {
  setupNetwork = 'internet';
  scanWifi();
});
bindTile(document.getElementById('tileLocal'), WIFI_MODE, 0, 'step-wifi', function() {
  setupNetwork = 'local';
});

document.getElementById('scanRefresh').addEventListener('click', scanWifi);

document.getElementById('wifiSetupForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var ssid = document.getElementById('setupSSID').value;
  var pass = document.getElementById('setupPassword').value;
  var confirm = document.getElementById('setupConfirmPassword').value;
  if (!ssid) {
    document.getElementById('wifiSsidRequired').classList.remove('hidden');
    return;
  }
  document.getElementById('wifiSsidRequired').classList.add('hidden');
  if (pass !== confirm) {
    document.getElementById('wifiPassMismatch').classList.remove('hidden');
    return;
  }
  document.getElementById('wifiPassMismatch').classList.add('hidden');
  setupSsid = ssid;
  setupWifiPass = pass;
  nvramGet(WIFI_SSID, ssid);
  if (pass) nvramGet(WIFI_PASSWORD, pass);
  nvramGet(WIFI_HIDE, document.getElementById('setupHiddenSSID').checked ? 1 : 0);
  showStep('step-plant-password');
});

document.getElementById('plantPasswordForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var pw = document.getElementById('setupPlantPassword').value;
  var confirm = document.getElementById('setupConfirmPlantPassword').value;
  if (pw !== confirm) {
    document.getElementById('plantPassMismatch').classList.remove('hidden');
    return;
  }
  document.getElementById('plantPassMismatch').classList.add('hidden');
  if (pw) nvramGet(DEMO_PASSWORD, pw);
  nvramGet(FIRST_SETUP, 0);
  if (setupNetwork === 'internet') {
    document.getElementById('progressBar').style.animationDuration = '6s';
    document.getElementById('plantPasswordForm').classList.add('hidden');
    document.getElementById('setupWaiting').classList.remove('hidden');
    setTimeout(function() { window.location.href = 'find.html'; }, 6000);
  } else {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'reboot', true);
    xhr.send();
    if (setupSsid === 'Plant' && !setupWifiPass) {
      window.location.href = 'index.html';
    } else {
      document.getElementById('progressBar').style.animationDuration = '12s';
      document.getElementById('reconnectMsg').textContent = 'Reconnect to Plant WiFi (SSID: ' + setupSsid + ')';
      document.getElementById('reconnectMsg').classList.remove('hidden');
      document.getElementById('plantPasswordForm').classList.add('hidden');
      document.getElementById('setupWaiting').classList.remove('hidden');
      setTimeout(function() { window.location.href = 'index.html'; }, 12000);
    }
  }
});

var EMAIL_ALERT = 22;
var SMTP_SERVER = 23;
var SMTP_USERNAME = 24;
var SMTP_PASSWORD = 25;
var PLANT_NAME = 26;
var ALERTS = 27;
var DEMO_PASSWORD = 28;
var FIRST_SETUP = 20;

document.getElementById('alertsSaveBtn').addEventListener('click', function() {
  var smtpPass = document.getElementById('setupAlertSMTPPassword').value;
  var confirmSmtp = document.getElementById('setupConfirmSMTPPassword').value;
  if (smtpPass !== confirmSmtp) {
    document.getElementById('smtpPassMismatch').classList.remove('hidden');
    return;
  }
  document.getElementById('smtpPassMismatch').classList.add('hidden');
  var set = document.querySelectorAll('#setupAlertsGrid .tab-checkbox');
  var bits = '';
  for (var i = 0; i < set.length; i++) {
    bits += set[i].checked ? '1' : '0';
  }
  bits += '0';
  document.getElementById('setupAlerts').value = bits;
  nvramGet(EMAIL_ALERT, document.getElementById('setupAlertEmail').value);
  nvramGet(SMTP_SERVER, document.getElementById('setupAlertSMTPServer').value);
  nvramGet(SMTP_USERNAME, document.getElementById('setupAlertSMTPUsername').value);
  nvramGet(SMTP_PASSWORD, smtpPass);
  nvramGet(PLANT_NAME, document.getElementById('setupAlertPlantName').value);
  nvramGet(ALERTS, bits);
  showStep('step-plant-password');
});
</script>
</body>
</html>
